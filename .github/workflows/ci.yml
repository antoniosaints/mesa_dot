name: Verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: bar_saas_test
          MYSQL_USER: bar_test
          MYSQL_PASSWORD: test_only_password
          MYSQL_ROOT_PASSWORD: root_test_password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot_test_password"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      TEST_DATABASE_URL: mysql://bar_test:test_only_password@127.0.0.1:3306/bar_saas_test
      TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm verify
      - run: pnpm test:integration
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results

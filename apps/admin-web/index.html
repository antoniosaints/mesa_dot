<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0757f9" />
    <link rel="icon" type="image/svg+xml" href="/mesa-mark.svg" />
    <meta
      name="description"
      content="Mesa: gestão para restaurantes e bares. Conecte mesas, comandas, pedidos, cozinha, estoque e caixa em um só lugar."
    />
    <title>Mesa · Gestão para restaurantes e bares</title>
    <style>
      #mesa-boot-loading {
        display: none;
      }
      html[data-mesa-branch-loading],
      html[data-mesa-branch-loading] body {
        margin: 0;
        overflow: hidden;
        background: var(--mesa-transition-background);
      }
      html[data-mesa-branch-loading] #mesa-boot-loading {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: grid;
        place-items: center;
        min-height: 100dvh;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        box-sizing: border-box;
        overflow: auto;
        background: var(--mesa-transition-background);
        color: var(--mesa-transition-text);
        font-family: system-ui, sans-serif;
        font-weight: 600;
      }
      #mesa-boot-loading .page-loading-content {
        width: min(100%, 440px);
        text-align: center;
      }
      #mesa-boot-name {
        display: block;
        margin-bottom: 28px;
        font-size: 22px;
        font-weight: 600;
        line-height: 1.5;
        overflow-wrap: anywhere;
      }
      #mesa-boot-loading .table-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 0;
        padding: 0;
        gap: 20px;
        color: var(--mesa-transition-muted);
        font-size: 14px;
      }
      #mesa-boot-loading svg {
        width: 64px;
        height: 64px;
        color: var(--mesa-transition-accent);
      }
      #mesa-boot-loading .mesa-loading-track {
        opacity: 0.14;
      }
      #mesa-boot-loading .mesa-loading-orbit {
        transform-origin: center;
        animation: mesa-boot-spin 1.1s linear infinite;
      }
      #mesa-boot-loading p {
        margin: 12px 0 0;
        color: var(--mesa-transition-muted);
        font-size: 12px;
        line-height: 1.8;
      }
      @keyframes mesa-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #mesa-boot-loading .mesa-loading-orbit {
          animation: none;
        }
      }
    </style>
    <script src="/mesa-boot.js"></script>
  </head>
  <body>
    <div id="mesa-boot-loading" aria-busy="true">
      <div class="page-loading-content">
        <strong id="mesa-boot-name"></strong>
        <div class="table-loading" role="status" aria-live="polite">
          <svg viewBox="0 0 48 48" width="64" height="64" fill="none" aria-hidden="true">
            <circle
              class="mesa-loading-track"
              cx="24"
              cy="24"
              r="20"
              stroke="currentColor"
              stroke-width="3"
            />
            <circle
              class="mesa-loading-orbit"
              cx="24"
              cy="24"
              r="20"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
              stroke-dasharray="30 96"
            />
            <rect
              x="15"
              y="15"
              width="18"
              height="18"
              rx="3"
              stroke="currentColor"
              stroke-width="2"
            />
            <path d="M15 21h18M21 21v12" stroke="currentColor" stroke-width="2" />
          </svg>
          <span>Abrindo filial…</span>
        </div>
        <p>Preparando sua unidade. Aguarde um instante.</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
